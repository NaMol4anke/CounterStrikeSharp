name: NEVA Linux release
on:
  workflow_dispatch:
  push:
    tags: ['v*-neva.*']
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    container: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Build against the fixed SDK
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C libraries/hl2sdk-cs2 rev-parse HEAD)" = 81020d1a26b9d4321b9f030c96929ec18e8c0cff
          export SEMVER="${GITHUB_REF_NAME#v}"
          export GITHUB_SHA_SHORT="${GITHUB_SHA:0:7}"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 4
          test -s build/addons/counterstrikesharp/bin/linuxsteamrt64/counterstrikesharp.so
          readelf -h build/addons/counterstrikesharp/bin/linuxsteamrt64/counterstrikesharp.so
          readelf -d build/addons/counterstrikesharp/bin/linuxsteamrt64/counterstrikesharp.so
      - uses: actions/upload-artifact@v4
        with:
          name: native-linux
          path: build/addons/
          if-no-files-found: error
  managed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run API tests
        run: dotnet test managed/CounterStrikeSharp.API.Tests/CounterStrikeSharp.API.Tests.csproj -c Release --logger trx --results-directory TestResults
      - name: Publish matching managed API
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish managed/CounterStrikeSharp.API/CounterStrikeSharp.API.csproj -c Release \
            -p:Version="${GITHUB_REF_NAME#v}" -p:AssemblyVersion=1.0.379.0 \
            -p:InformationalVersion="${GITHUB_REF_NAME#v}+${GITHUB_SHA}" -o build/api
      - uses: actions/upload-artifact@v4
        with:
          name: managed-api
          path: build/api/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results
          path: TestResults/
  release:
    needs: [native, managed]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: native-linux
          path: package/addons
      - uses: actions/download-artifact@v4
        with:
          name: managed-api
          path: package/addons/counterstrikesharp/api
      - name: Package and verify Linux distributions
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          cp NEVA-HOTFIX.md package/NEVA-HOTFIX.md
          printf 'Source commit: %s\nSDK commit: %s\n' "$GITHUB_SHA" 81020d1a26b9d4321b9f030c96929ec18e8c0cff > package/BUILD-PROVENANCE.txt
          test -s package/addons/counterstrikesharp/api/CounterStrikeSharp.API.dll
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('package/addons/counterstrikesharp/gamedata/gamedata.json').read_text())
          assert data['ClientPrint']['signatures']['linux'] == '55 48 8D 05 ? ? ? ? 48 89 E5 41 57 4D 89 CF 41 56 4D 89 C6 41 55 49 89 F5'
          PY
          (cd package && zip -qr "../counterstrikesharp-linux-${version}.zip" .)
          mkdir -p package/addons/counterstrikesharp/dotnet
          curl -fSL --retry 3 https://builds.dotnet.microsoft.com/dotnet/aspnetcore/Runtime/10.0.3/aspnetcore-runtime-10.0.3-linux-x64.tar.gz -o runtime.tar.gz
          tar -xzf runtime.tar.gz -C package/addons/counterstrikesharp/dotnet
          test -x package/addons/counterstrikesharp/dotnet/dotnet
          test -s package/addons/counterstrikesharp/dotnet/shared/Microsoft.NETCore.App/10.0.3/libhostpolicy.so
          (cd package && zip -qr "../counterstrikesharp-with-runtime-linux-${version}.zip" .)
          sha256sum counterstrikesharp-*.zip > SHA256SUMS.txt
          unzip -t "counterstrikesharp-with-runtime-linux-${version}.zip" | tail -n 1
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" counterstrikesharp-*.zip SHA256SUMS.txt --verify-tag --title "CounterStrikeSharp $GITHUB_REF_NAME — CS2 1.41.9.7 hotfix (Linux)" --notes-file NEVA-HOTFIX.md --latest